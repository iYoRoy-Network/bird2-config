---
# Deployment settings
bird_deploy:
  remote_dir: /etc/bird
  staging_parent: /var/tmp/bird2-configuration
  backup_parent: /var/backups/bird2-configuration
  check_command: bird -p -c bird.conf
  reload_command: birdc configure
  secrets_file: '{{ inventory_dir }}/secrets/bird.yml'
  preserve_patterns:
    - secrets.conf

wireguard_deploy:
  enabled: false
  render_root: '{{ inventory_dir }}/../.rendered-wireguard'
  remote_dir: /etc/wireguard
  staging_parent: /var/tmp/bird2-configuration-wireguard
  backup_parent: /var/backups/bird2-configuration-wireguard
  secrets_file: '{{ inventory_dir }}/secrets/wireguard.yml'
