---
# Per-domain global defaults (DN42 / IANA / intra confederation)
route_domains:
  dn42:
    origin_as: 4242422024
  iana:
    origin_as: 205369

dn42_global:
  own_net: 172.20.234.224/28
  own_net_v6: fd18:3e15:61d0::/48
  own_netset: '[ 172.20.234.224/28+ ]'
  own_netset_v6: '[ fd18:3e15:61d0::/48+ ]'
  # DN42's route-origin geo community namespace: (64511, region|country)
  geo_comm_as: 64511
iana_global:
  anycast_net_v6: 2a14:7581:0ffb::/48
  own_netset_v6: '[ 2a14:7581:0ffb::/48+, 2a14:7583:f200::/40+, 2a14:67c3:fff0::/44+, 2a14:67c3:c0::/44+ ]'
  # ONLY_REGION matches the target peer's configured region, not the local PoP.
  export_to_continent_communities:
    ASIA:
      - [205369, COMM_FN_ONLY_REGION, GEO_REGION_ASIA_SOUTH]
      - [205369, COMM_FN_ONLY_REGION, GEO_REGION_ASIA_SOUTHEAST]
      - [205369, COMM_FN_ONLY_REGION, GEO_REGION_ASIA_EAST]
      - [205369, COMM_FN_ONLY_REGION, GEO_REGION_ASIA_NORTH]
      - [205369, COMM_FN_ONLY_REGION, GEO_REGION_ASIA_WEST]
      - [205369, COMM_FN_ONLY_REGION, GEO_REGION_ASIA_CENTRAL]
      - [205369, COMM_FN_DENY_AS, 6939]
    EUROPE:
      - [205369, COMM_FN_ONLY_REGION, GEO_REGION_EUROPE]
intra_global:
  confederation_start: 4220240000
  confederation_end: 4220249999
  prefix_v4: '[ 100.64.0.0/16+ ]'
  prefix_v6: '[ fd18:3e15:61d0:ffff::/64+ ]'
  loopback_v6_prefix: fd18:3e15:61d0:ffff
  link_local_prefix: fe80::2024
  confederation_as_format: '422024%d%d%02d'
  flapalerted:
    server_node: hkg01-hk
    bgp_port: 1790
    rpki_port: 8083
  underlay_loopback_communities:
    - [4242422024, COMM_FN_IDENTIFY, COMM_ORIGIN_CUSTOMER]
    - [COMM_FN_WELLKNOWN, COMM_WK_NO_EXPORT]
  dn42_overlay_route_communities:
    - [4242422024, COMM_FN_IDENTIFY, COMM_ORIGIN_CUSTOMER]
    - [COMM_FN_WELLKNOWN, COMM_WK_NO_EXPORT]
  iana_overlay_route_communities:
    - [205369, COMM_FN_IDENTIFY, COMM_ORIGIN_CUSTOMER]
    - [COMM_FN_WELLKNOWN, COMM_WK_NO_EXPORT]
