---
# Geo code registry, shared by every domain's route-origin communities.
# Both are the value used in the *community* third field:
#   region  = DN42 region code, 41-70.   (64511, region) / (205369, 644|645, region)
#   country = ISO-3166-1 numeric + 1000. (64511, country) / (205369, 644|645, country)
# The +1000 keeps country clear of the region range, since 644/645 carry both in
# the same field (raw ISO numerics 4-894 would otherwise collide with 41-70).
# Only the values our PoPs and peers actually use are kept; extend as needed.
geo_region:
  EUROPE: 41
  NA_EAST: 42
  NA_CENTRAL: 43
  NA_WEST: 44
  CENTRAL_AMERICA: 45
  SA_EAST: 46
  SA_WEST: 47
  AFRICA_NORTH: 48
  AFRICA_SOUTH: 49
  ASIA_SOUTH: 50
  ASIA_SOUTHEAST: 51
  ASIA_EAST: 52
  OCEANIA: 53
  ANTARCTICA: 54
  ASIA_NORTH: 55
  ASIA_WEST: 56
  ASIA_CENTRAL: 57
geo_country:
  CANADA: 1124
  CHINA: 1156
  TAIWAN: 1158
  FRANCE: 1250
  GERMANY: 1276
  HONG_KONG: 1344
  JAPAN: 1392
  NETHERLANDS: 1528
  NORWAY: 1578
  RUSSIA: 1643
  SINGAPORE: 1702
  SWITZERLAND: 1756
  UNITED_KINGDOM: 1826
  UNITED_STATES: 1840
