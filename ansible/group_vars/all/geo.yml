---
# Geo code registry, shared by every domain's route-origin communities:
#   region  = DN42 region code (41-70), used as DN42 (64511, region) and
#             public (205369, 644|645, region).
#   country = raw ISO-3166-1 numeric, used as public (205369, 644|645, country)
#             and, on the DN42 side, as (64511, 1000 + country).
# Only the values our PoPs and peers actually use are kept; extend as needed.
geo_region:
  EUROPE: 41
  NA_EAST: 42
  NA_CENTRAL: 43
  NA_WEST: 44
  CENTRAL_AMERICA: 45
  SA_EAST: 46
  SA_WEST: 47
  AFRICA_NORTH: 48
  AFRICA_SOUTH: 49
  ASIA_SOUTH: 50
  ASIA_SOUTHEAST: 51
  ASIA_EAST: 52
  OCEANIA: 53
  ANTARCTICA: 54
  ASIA_NORTH: 55
  ASIA_WEST: 56
  ASIA_CENTRAL: 57
geo_country:
  CANADA: 124
  CHINA: 156
  TAIWAN: 158
  FRANCE: 250
  GERMANY: 276
  HONG_KONG: 344
  JAPAN: 392
  NETHERLANDS: 528
  NORWAY: 578
  RUSSIA: 643
  SINGAPORE: 702
  SWITZERLAND: 756
  UNITED_KINGDOM: 826
  UNITED_STATES: 840
