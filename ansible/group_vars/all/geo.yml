---
# Geo code registry, shared by every domain's route-origin communities:
# DN42 uses (64511, region) / (64511, country); the public/IANA side uses the
# same code table as (205369, 644|645, code).
# Region range 41-70; country range 1000-1999 = ISO-3166-1 numeric + 1000.
# Full ISO table is ~200 rows; only the values our PoPs and peers actually use
# are kept here, extend as needed.
geo_region:
  EUROPE: 41
  NA_EAST: 42
  NA_CENTRAL: 43
  NA_WEST: 44
  CENTRAL_AMERICA: 45
  SA_EAST: 46
  SA_WEST: 47
  AFRICA_NORTH: 48
  AFRICA_SOUTH: 49
  ASIA_SOUTH: 50
  ASIA_SOUTHEAST: 51
  ASIA_EAST: 52
  OCEANIA: 53
  ANTARCTICA: 54
  ASIA_NORTH: 55
  ASIA_WEST: 56
  ASIA_CENTRAL: 57
geo_country:
  CANADA: 1124
  CHINA: 1156
  TAIWAN: 1158
  FRANCE: 1250
  GERMANY: 1276
  HONG_KONG: 1344
  JAPAN: 1392
  NETHERLANDS: 1528
  NORWAY: 1578
  RUSSIA: 1643
  SINGAPORE: 1702
  SWITZERLAND: 1756
  UNITED_KINGDOM: 1826
  UNITED_STATES: 1840
