intra:
  flapalerted:
    enabled: true
  auto_confed_peers:
    - node: fra01-de
      wireguard:
        mtu: 1420
        address_mode: intra_local
        persistent_keepalive: 10
      bgp:
        ipv4:
          import_policy: dn42_full
          export_policy: dn42_full
        ipv6:
          import_policy: dn42_full
          export_policy: dn42_full
