iana:
  enabled: true
  upstreams6:
  - protocol: iana_upstream_7720
    description: SkyWolf
    neighbor:
      address: fd00:7720::1
      asn: 7720
    multihop: 2
    next_hop_rewrites:
    - from: fd00:7720::1
      to: 2401:5a0:1000::1
  downstreams: []
  peers: []
  ibgp:
    enabled: false
    sessions: []
  static:
    advertise_routes:
    - prefix: "2a14:7583:f220::/43"
      communities:
        - [IANA_OWNAS, COMM_FN_DENY_AS, 6939]
    - "{{ iana_global.anycast_net_v6 }}"
    extra_routes:
    - protocol: iana_static
      prefixes:
      - prefix: 2401:5a0:1000::1/128
        via:
          address: fe80::232:17ff:fe4b:e4e0
          interface: eth0
        communities:
        - [COMM_FN_WELLKNOWN, COMM_WK_NO_ADVERTISE]
      - prefix: fd00:7720::1/128
        via:
          address: fe80::232:17ff:fe4b:e4e0
          interface: eth0
        communities:
        - [COMM_FN_WELLKNOWN, COMM_WK_NO_ADVERTISE]
  router_id: 103.213.4.103
