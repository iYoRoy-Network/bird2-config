intra:
  flapalerted:
    enabled: true
  auto_confed_peers:
    - node: tyo01-jp
      wireguard:
        fwmark: '4242'
        address_mode: intra_local
      bgp:
        ipv4:
          import_policy: full
          export_policy: full
        ipv6:
          import_policy: full
          export_policy: full
    - node: tyo03-jp
      wireguard:
        address_mode: intra_local
        passive: true
      bgp:
        ipv4:
          import_policy: full
          export_policy: full
        ipv6:
          import_policy: full
          export_policy: full
