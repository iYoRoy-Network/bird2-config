intra:
  flapalerted:
    enabled: true
  auto_confed_peers:
    - node: tyo01-jp
      wireguard:
        listen_port: 10227
        fwmark: '4242'
        address_mode: intra_local
      bgp:
        ipv4:
          import_policy: full
          export_policy: full
        ipv6:
          import_policy: full
          export_policy: full
    - node: tyo02-jp
      wireguard:
        listen_port: 10230
        address_mode: intra_local
      bgp:
        ipv4:
          import_policy: full
          export_policy: full
        ipv6:
          import_policy: full
          export_policy: full
    - node: pvg01-cn
      wireguard:
        listen_port: 6433
        fwmark: '4242'
        address_mode: intra_local
        passive: true
      bgp:
        ipv4:
          import_policy: full
          export_policy: full
        ipv6:
          import_policy: full
          export_policy: full
