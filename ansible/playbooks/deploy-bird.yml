- name: Deploy rendered BIRD configs remotely
  hosts: bird_nodes
  gather_facts: false
  strategy: free
  become: "{{ deploy.become | default(false) }}"
  vars:
    node_output_dir: "{{ render_root }}/{{ inventory_hostname }}"
    bird_staging_dir: "{{ bird_run.path }}/artifact"
    bird_backup_dir: "{{ bird_deploy.backup_parent }}/{{ bird_run.path | basename }}"
  tasks:
    - name: Skip hosts with BIRD deploy disabled
      ansible.builtin.meta: end_host
      when: not (deploy.bird.enabled | default(true))

    - name: Refuse placeholder production hosts
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host != 'CHANGEME'
          - ansible_connection | default('ssh') != 'local'
        fail_msg: "Set ansible_host for {{ inventory_hostname }} in ansible/inventory.production.yml before deploying."

    - name: Check rendered BIRD config exists locally
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ node_output_dir }}/bird.conf"
      register: rendered_bird_conf

    - name: Require local rendered config
      ansible.builtin.assert:
        that:
          - rendered_bird_conf.stat.exists
        fail_msg: "Render {{ inventory_hostname }} first with ansible/playbooks/render.yml."

    - name: Verify BIRD artifact before upload
      ansible.builtin.include_tasks: ../tasks/verify-artifact.yml
      vars:
        artifact_dir: "{{ node_output_dir }}"
        artifact_kind: bird

    - name: End after local verification in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode | bool

    - name: Ensure remote deployment directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ bird_deploy.staging_parent }}"
        - "{{ bird_deploy.backup_parent }}"

    - name: Allocate isolated remote BIRD deployment directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ bird_deploy.staging_parent }}"
        prefix: "{{ inventory_hostname }}-"
      register: bird_run

    - name: Create remote staging directory
      ansible.builtin.file:
        path: "{{ bird_staging_dir }}"
        state: directory
        mode: "0755"

    - name: Rsync rendered BIRD config to remote staging
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --delete
          - --chmod=D755,F644
          - --chown=root:root
          - -e
          - "ssh -i {{ ansible_ssh_private_key_file | expanduser }}{% if ansible_port is defined %} -p {{ ansible_port }}{% endif %} -o StrictHostKeyChecking=accept-new {{ ansible_ssh_common_args | default('') }}"
          - "{{ node_output_dir }}/"
          - "{{ ansible_user | default('root') }}@{{ ansible_host }}:{{ bird_staging_dir }}/"
      changed_when: true
      check_mode: false
      no_log: true

    - name: Parse-check staged BIRD config remotely
      ansible.builtin.command: "{{ bird_deploy.check_command }}"
      args:
        chdir: "{{ bird_staging_dir }}"
      changed_when: false

    - name: Upload shared BIRD deployment helper
      ansible.builtin.copy:
        src: ../files/bird_deploy.py
        dest: "{{ bird_run.path }}/bird_deploy.py"
        mode: '0700'

    - name: Upload artifact verification helper
      ansible.builtin.copy:
        src: ../files/artifact.py
        dest: "{{ bird_run.path }}/artifact.py"
        mode: '0700'

    - name: Apply BIRD tree with validation and recovery
      ansible.builtin.command:
        argv: >-
          {{ ['python3', bird_run.path ~ '/bird_deploy.py',
              '--staging-dir', bird_staging_dir,
              '--live-dir', bird_deploy.remote_dir,
              '--backup-dir', bird_backup_dir,
              '--check-command', bird_deploy.check_command,
              '--reload-command', bird_deploy.reload_command]
             + ['--node', inventory_hostname]
             + (bird_deploy.preserve_patterns | default([]) | map('regex_replace', '^(.*)$', '--preserve=\1') | list) }}

    - name: Remove successful BIRD deployment staging
      ansible.builtin.file:
        path: "{{ bird_run.path }}"
        state: absent
