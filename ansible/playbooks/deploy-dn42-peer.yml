---
- name: Render and deploy one DN42 peer
  hosts: bird_nodes
  gather_facts: false
  become: "{{ deploy.become | default(false) }}"
  vars:
    target_peer_state: present
    peer_present: "{{ target_peer_state == 'present' }}"
    peer_interface: "dn42_{{ target_peer_asn }}"
    target_peer_file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/dn42-peers/{{ target_peer_asn }}.yml"
  tasks:
    - name: Require remote inventory and valid peer scope
      ansible.builtin.assert:
        that:
          - ansible_connection | default('ssh') != 'local'
          - target_peer_asn | int | string == target_peer_asn | string
          - target_peer_state in ['present', 'absent']
          - apply_wireguard | default(true) | bool or apply_bird | default(true) | bool

    - name: End before remote changes in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode | bool

    - name: Allocate isolated peer staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: bird-peer-
      register: peer_stage

    - name: Apply peer update
      block:
        - name: Derive node addressing
          ansible.builtin.include_tasks: ../tasks/derive-node-addressing.yml

        - name: Load target peer
          ansible.builtin.include_vars:
            file: "{{ target_peer_file }}"
            name: target_peer
          when: peer_present | bool

        - name: Require matching ASN and interface
          ansible.builtin.assert:
            that:
              - target_peer.asn | int == target_peer_asn | int
              - target_peer.wireguard.interface | default(peer_interface) == peer_interface
          when: peer_present | bool

        - name: Restrict materialization to target peer
          ansible.builtin.set_fact:
            dn42: "{{ dn42 | default({}) | combine({'enabled': true, 'peers': [target_peer]}) }}"
            intra: {auto_confed_peers: [], explicit_confed_peers: []}
            wireguard: "{{ wireguard | combine({'standalone_interfaces': []}) }}"
          when: peer_present | bool

        - name: Materialize target
          ansible.builtin.include_tasks: ../tasks/materialize-domain-intent.yml
          when: peer_present | bool

        - name: Load WireGuard secrets
          ansible.builtin.include_vars:
            file: "{{ wireguard_deploy.secrets_file }}"
          no_log: true
          when: peer_present | bool and apply_wireguard | default(true) | bool

        - name: Create peer staging directories
          ansible.builtin.file:
            path: "{{ peer_stage.path }}/{{ item }}"
            state: directory
            mode: '0700'
          loop: [wireguard, bird/dn42/peers]

        - name: Render WireGuard target to staging
          ansible.builtin.template:
            src: ../templates/wireguard/wg-quick.conf.j2
            dest: "{{ peer_stage.path }}/wireguard/{{ peer_interface }}.conf"
            mode: '0600'
          vars:
            wg_interface: "{{ effective_wireguard_interfaces | selectattr('name', 'equalto', peer_interface) | first }}"
          no_log: true
          when: peer_present | bool and apply_wireguard | default(true) | bool

        - name: Render BIRD target to staging
          ansible.builtin.template:
            src: ../templates/bird/dn42/peer.conf.j2
            dest: "{{ peer_stage.path }}/bird/dn42/peers/{{ peer_interface }}.conf"
            mode: '0644'
          vars:
            peer_bundle: "{{ effective_dn42_peer_sessions | first }}"
          when: peer_present | bool and apply_bird | default(true) | bool

        - name: Upload shared deployment helpers
          ansible.builtin.copy:
            src: "../files/{{ item }}_deploy.py"
            dest: "{{ peer_stage.path }}/{{ item }}_deploy.py"
            mode: '0700'
          loop: [wireguard, bird]

        - name: Apply scoped WireGuard update with recovery
          ansible.builtin.command:
            argv:
              - python3
              - "{{ peer_stage.path }}/wireguard_deploy.py"
              - --staging-dir
              - "{{ peer_stage.path }}/wireguard"
              - --live-dir
              - "{{ wireguard_deploy.remote_dir }}"
              - --backup-dir
              - "{{ peer_stage.path }}/wireguard-backup"
              - --service-manager
              - "{{ deploy.service_manager | default('systemd') }}"
              - --interface
              - "{{ peer_interface }}"
          no_log: true
          when: apply_wireguard | default(true) | bool

        - name: Apply scoped BIRD update with recovery
          ansible.builtin.command:
            argv: >-
              {{ ['python3', peer_stage.path ~ '/bird_deploy.py',
                  '--staging-dir', peer_stage.path ~ '/bird',
                  '--live-dir', bird_deploy.remote_dir,
                  '--backup-dir', peer_stage.path ~ '/bird-backup',
                  '--file', 'dn42/peers/' ~ peer_interface ~ '.conf',
                  '--check-command', bird_deploy.check_command,
                  '--reload-command', bird_deploy.reload_command]
                 + (['--remove'] if not peer_present | bool else []) }}
          when: apply_bird | default(true) | bool
      rescue:
        - name: Retain backups for inspection after a failed peer update
          ansible.builtin.fail:
            msg: "Peer update failed. Recovery details are above; staging and backups remain at {{ peer_stage.path }}."

    - name: Remove successful peer staging directory
      ansible.builtin.file:
        path: "{{ peer_stage.path }}"
        state: absent
