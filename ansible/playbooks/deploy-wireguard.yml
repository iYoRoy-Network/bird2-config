- name: Deploy rendered WireGuard configs remotely
  hosts: bird_nodes
  gather_facts: false
  strategy: free
  become: "{{ deploy.become | default(false) }}"
  vars:
    wg_output_dir: "{{ wireguard_deploy.render_root }}/{{ inventory_hostname }}"
    wireguard_staging_dir: "{{ wireguard_run.path }}/artifact"
    wireguard_helper_path: "{{ wireguard_run.path }}/wireguard_deploy.py"
    wireguard_backup_dir: "{{ wireguard_deploy.backup_parent }}/{{ wireguard_run.path | basename }}"
  tasks:
    - name: Skip hosts with WireGuard deploy disabled
      ansible.builtin.meta: end_host
      when: not (deploy.wireguard.enabled | default(wireguard_deploy.enabled | default(false)))

    - name: Load DN42 peer definitions
      ansible.builtin.include_tasks: ../tasks/load-dn42-peers.yml

    - name: Refuse placeholder production hosts
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host != 'CHANGEME'
          - ansible_connection | default('ssh') != 'local'
        fail_msg: "Set ansible_host for {{ inventory_hostname }} in ansible/inventory.production.yml before deploying WireGuard."

    - name: Materialize domain intent variables
      ansible.builtin.include_tasks: ../tasks/materialize-domain-intent.yml

    - name: Require effective WireGuard interface definitions
      ansible.builtin.assert:
        that:
          - effective_wireguard_interfaces is defined
          - effective_wireguard_interfaces | length > 0
        fail_msg: "No effective_wireguard_interfaces for {{ inventory_hostname }} before deploying WireGuard."

    - name: Check rendered WireGuard config directory exists locally
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ wg_output_dir }}"
      register: rendered_wireguard_dir

    - name: Require local rendered WireGuard config directory
      ansible.builtin.assert:
        that:
          - rendered_wireguard_dir.stat.exists
          - rendered_wireguard_dir.stat.isdir
        fail_msg: "Render {{ inventory_hostname }} WireGuard configs first with ansible/playbooks/render-wireguard.yml."

    - name: Verify WireGuard artifact before upload
      ansible.builtin.include_tasks: ../tasks/verify-artifact.yml
      vars:
        artifact_dir: "{{ wg_output_dir }}"
        artifact_kind: wireguard

    - name: End after local verification in check mode
      ansible.builtin.meta: end_host
      when: ansible_check_mode | bool

    - name: Ensure remote WireGuard deployment directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ wireguard_deploy.staging_parent }}"
        - "{{ wireguard_deploy.backup_parent }}"

    - name: Allocate isolated remote WireGuard deployment directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ wireguard_deploy.staging_parent }}"
        prefix: "{{ inventory_hostname }}-"
      register: wireguard_run

    - name: Create remote WireGuard staging directory
      ansible.builtin.file:
        path: "{{ wireguard_staging_dir }}"
        state: directory
        mode: "0700"
      check_mode: false

    - name: Rsync rendered WireGuard configs to remote staging
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --delete
          - --chmod=D700,F600
          - --chown=root:root
          - -e
          - "ssh -i {{ ansible_ssh_private_key_file | expanduser }}{% if ansible_port is defined %} -p {{ ansible_port }}{% endif %} -o StrictHostKeyChecking=accept-new {{ ansible_ssh_common_args | default('') }}"
          - "{{ wg_output_dir }}/"
          - "{{ ansible_user | default('root') }}@{{ ansible_host }}:{{ wireguard_staging_dir }}/"
      changed_when: true
      check_mode: false
      no_log: true

    - name: Upload WireGuard deploy helper
      ansible.builtin.copy:
        src: ../files/wireguard_deploy.py
        dest: "{{ wireguard_helper_path }}"
        owner: root
        group: root
        mode: "0700"
      check_mode: false

    - name: Upload artifact verification helper
      ansible.builtin.copy:
        src: ../files/artifact.py
        dest: "{{ wireguard_run.path }}/artifact.py"
        owner: root
        group: root
        mode: '0700'
      check_mode: false

    - name: Run WireGuard deploy helper
      ansible.builtin.command:
        argv: >-
          {{
            [
              'python3',
              wireguard_helper_path,
              '--staging-dir', wireguard_staging_dir,
              '--live-dir', wireguard_deploy.remote_dir,
              '--backup-dir', wireguard_backup_dir,
              '--node', inventory_hostname,
              '--service-manager', deploy.service_manager | default('systemd')
            ] + (['--dry-run'] if ansible_check_mode | bool else [])
          }}
      register: wireguard_helper_result
      changed_when: "'\"changed\": true' in wireguard_helper_result.stdout"
      check_mode: false

    - name: Show WireGuard deploy helper summary
      ansible.builtin.debug:
        msg: "{{ wireguard_helper_result.stdout | from_json }}"

    - name: Remove successful WireGuard deployment staging
      ansible.builtin.file:
        path: "{{ wireguard_run.path }}"
        state: absent
