- name: Render BIRD configs locally
  hosts: bird_nodes
  gather_facts: false
  strategy: free
  become: false
  check_mode: false
  vars:
    node_output_dir: "{{ bird_render_stage.path }}"
  tasks:
    - name: Derive node addressing variables
      ansible.builtin.include_tasks: ../tasks/derive-node-addressing.yml

    - name: Load DN42 peer definitions
      ansible.builtin.include_tasks: ../tasks/load-dn42-peers.yml

    - name: Derive enabled domain files and defines
      ansible.builtin.include_tasks: ../tasks/derive-bird-context.yml

    - name: Normalize and validate domain intent
      ansible.builtin.include_tasks: ../tasks/materialize-domain-intent.yml

    - name: Check optional BIRD secrets file
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ bird_deploy.secrets_file }}"
      register: bird_secrets_file

    - name: Load optional BIRD secrets
      delegate_to: localhost
      ansible.builtin.include_vars:
        file: "{{ bird_deploy.secrets_file }}"
      when: bird_secrets_file.stat.exists
      no_log: true

    - name: Set default BIRD secrets
      ansible.builtin.set_fact:
        bird_secrets: "{{ {'bgp_passwords': {}} | combine(bird_secrets | default({}), recursive=True) }}"
      no_log: true

    - name: Ensure render parent exists
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ render_root }}"
        state: directory
        mode: '0755'

    - name: Allocate isolated render directory
      delegate_to: localhost
      ansible.builtin.tempfile:
        state: directory
        path: "{{ render_root }}"
        prefix: ".{{ inventory_hostname }}-"
      register: bird_render_stage

    - name: Build and publish validated BIRD artifact
      block:
        - name: Create rendered root directory
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ node_output_dir }}"
            state: directory
            mode: "0755"

        - name: Create mandatory intra module directories
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ node_output_dir }}/{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - intra
            - intra/ibgp

        - name: Create IANA module directory
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ node_output_dir }}/iana"
            state: directory
            mode: "0755"
          when: bird_domain_files.iana | length > 0

        - name: Create DN42 module directory
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ node_output_dir }}/dn42"
            state: directory
            mode: "0755"
          when: bird_domain_files.dn42 | length > 0

        - name: Create DN42 peers directory
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ node_output_dir }}/dn42/peers"
            state: directory
            mode: "0755"
          when:
            - bird_domain_files.dn42 | length > 0
            - (dn42.peers | default([])) | length > 0

        - name: Render root BIRD files
          delegate_to: localhost
          ansible.builtin.template:
            src: "../templates/bird/{{ item }}.j2"
            dest: "{{ node_output_dir }}/{{ item }}"
            mode: "0644"
          loop:
            - bird.conf
            - envvars
            - filter.conf
            - kernel.conf

        - name: Render DN42 module files
          delegate_to: localhost
          ansible.builtin.template:
            src: "../templates/bird/dn42/{{ item }}.j2"
            dest: "{{ node_output_dir }}/dn42/{{ item }}"
            mode: "0644"
          loop: "{{ bird_domain_files.dn42 }}"

        - name: Render DN42 peer sessions
          delegate_to: localhost
          ansible.builtin.template:
            src: ../templates/bird/dn42/peer.conf.j2
            dest: "{{ node_output_dir }}/dn42/peers/dn42_{{ peer.asn }}.conf"
            mode: "0644"
          loop: "{{ effective_dn42_peer_sessions | default([]) }}"
          loop_control:
            loop_var: peer_bundle
            label: "dn42_{{ peer_bundle.peer.asn }}"
          vars:
            peer: "{{ peer_bundle.peer }}"
          when: bird_domain_files.dn42 | length > 0

        - name: Render intra module files
          delegate_to: localhost
          ansible.builtin.template:
            src: "../templates/bird/intra/{{ item }}.j2"
            dest: "{{ node_output_dir }}/intra/{{ item }}"
            mode: "0644"
          loop: "{{ bird_domain_files.intra }}"

        - name: Render intra iBGP sessions
          delegate_to: localhost
          ansible.builtin.template:
            src: ../templates/bird/intra/ibgp-session.conf.j2
            dest: "{{ node_output_dir }}/intra/ibgp/{{ session.file }}"
            mode: "0644"
          loop: "{{ effective_intra_ibgp_sessions }}"
          loop_control:
            loop_var: session

        - name: Render IANA module files
          delegate_to: localhost
          ansible.builtin.template:
            src: "../templates/bird/iana/{{ item }}.j2"
            dest: "{{ node_output_dir }}/iana/{{ item }}"
            mode: "0644"
          diff: false
          no_log: true
          loop: "{{ bird_domain_files.iana }}"
          when: bird_domain_files.iana | length > 0

        - name: Load fixed IRR snapshot
          delegate_to: localhost
          ansible.builtin.include_vars:
            file: "{{ inventory_dir }}/irr/{{ inventory_hostname }}.json"
            name: irr_snapshot
          when:
            - bird_domain_files.iana | length > 0
            - (iana | irr_queries) | length > 0

        - name: Render fixed IRR AS-SETs
          delegate_to: localhost
          ansible.builtin.copy:
            content: "{{ irr_snapshot | irr_defines(iana | irr_queries) }}"
            dest: "{{ node_output_dir }}/iana_downstream_whitelist.conf"
            mode: '0644'
          when:
            - bird_domain_files.iana | length > 0
            - (iana | irr_queries) | length > 0

        - name: Validate complete staged BIRD configuration
          delegate_to: localhost
          ansible.builtin.command: bird -p -c bird.conf
          args:
            chdir: "{{ node_output_dir }}"
          changed_when: false

        - name: Seal and publish complete BIRD artifact
          delegate_to: localhost
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/../files/artifact.py"
              - "{{ node_output_dir }}"
              - --seal
              - --node
              - "{{ inventory_hostname }}"
              - --kind
              - bird
              - --source-root
              - "{{ inventory_dir }}/.."
              - --publish
              - "{{ render_root }}/{{ inventory_hostname }}"
      always:
        - name: Remove temporary BIRD render directory
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ bird_render_stage.path }}"
            state: absent
