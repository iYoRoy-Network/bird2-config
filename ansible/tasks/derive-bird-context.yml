---
- name: Require the intra domain
  ansible.builtin.assert:
    quiet: true
    that:
      - intra is defined
      - intra is mapping
    fail_msg: "{{ inventory_hostname }} must define the mandatory intra domain."

- name: Derive route-domain origin ASNs and BIRD module plan
  ansible.builtin.set_fact:
    bird_route_origin_asns: >-
      {{
        ([route_domains.dn42.origin_as | int]
         if (dn42.enabled | default(false) | bool) else [])
        +
        ([route_domains.iana.origin_as | int]
         if (iana.enabled | default(false) | bool) else [])
      }}
    bird_domain_files: "{{ {'iana': iana | default({}), 'dn42': dn42 | default({}), 'intra': intra | default({})} | bird_modules }}"

- name: Validate enabled Flapalerted client
  ansible.builtin.assert:
    quiet: true
    that:
      - dn42.enabled | default(false) | bool
      - intra.flapalerted.server_node | default(intra_global.flapalerted.server_node, true) in hostvars
      - inventory_hostname != (intra.flapalerted.server_node | default(intra_global.flapalerted.server_node, true))
    fail_msg: >-
      Flapalerted on {{ inventory_hostname }} needs a different server_node that
      exists in hostvars and requires the DN42 module to be enabled.
  when: intra.flapalerted.enabled | default(false)
