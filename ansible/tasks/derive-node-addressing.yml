---
# Derive per-node addressing once so templates reference variables instead of
# recomputing the formulas. Included by every play that renders a template
# which needs them.
- name: Derive node addressing variables
  ansible.builtin.set_fact:
    derived_public_ipv6: "{{ node | public_ipv6 }}"
    derived_intra_as: "{{ node | intra_as(intra_global) }}"
    derived_intra_loopback_v4: "{{ node | intra_loopback_v4 }}"
    derived_intra_loopback_v6: "{{ node | intra_loopback_v6(intra_global) }}"
    derived_intra_lla: "{{ node | intra_lla(intra_global) }}"
