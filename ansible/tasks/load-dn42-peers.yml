---
- name: Check DN42 peer definitions directory
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/dn42-peers"
  register: dn42_peer_files_dir

- name: Reject ambiguous DN42 peer sources
  ansible.builtin.assert:
    that:
      - not (dn42_peer_files_dir.stat.exists | default(false)) or (dn42.peers | default([]) | length == 0)
    fail_msg: "Use dn42-peers/*.yml or inline dn42.peers, not both."
  when: not (dn42_peer_source_loaded | default(false))

- name: Load DN42 peer definitions
  ansible.builtin.include_vars:
    file: "{{ item }}"
    name: _dn42_peer
  loop: "{{ query('ansible.builtin.fileglob', inventory_dir ~ '/host_vars/' ~ inventory_hostname ~ '/dn42-peers/*.yml') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
  register: _dn42_peer_file_results
  when: dn42_peer_files_dir.stat.exists | default(false)

- name: Build DN42 peer list from individual files
  ansible.builtin.set_fact:
    dn42: "{{ (dn42 | default({})) | combine({'peers': _dn42_peer_file_results.results | map(attribute='ansible_facts._dn42_peer') | list}, recursive=True) }}"
    dn42_peer_source_loaded: true
  when: dn42_peer_files_dir.stat.exists | default(false)
