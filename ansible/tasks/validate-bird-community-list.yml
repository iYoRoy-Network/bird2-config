- name: Validate BIRD community entries for {{ community_context }}
  ansible.builtin.assert:
    quiet: true
    that:
      - community is sequence and community is not string and community is not mapping
      - community | length in [2, 3]
      - >-
        community | map('string')
        | map('regex_search', '^([0-9]+|[A-Z][A-Z0-9_]*)$')
        | select('string') | list | length == community | length
    fail_msg: >-
      Invalid BGP community in {{ inventory_hostname }} {{ community_context }}:
      {{ community | to_json }}. Use a 2/3-element YAML list of numbers or
      COMM_* / ASN macro names ([asn, value] or [global, local1, local2]).
  loop: "{{ community_list | default([]) }}"
  loop_control:
    loop_var: community
    label: "{{ community_context }}: {{ community | to_json }}"
